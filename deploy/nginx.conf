# nginx для сайта на Amvera. HTTPS принимает прокси Amvera,
# в контейнер запросы приходят по HTTP на порт 80.

# HTML, стили и скрипты без хешей в именах: браузер каждый раз сверяется с сервером
# и получает 304, если файл не менялся. Шрифты меняются редко, фото и видео раз в сутки.
map $uri $site_cache_control {
    default                 "no-cache";
    ~^/assets/fonts/        "public, max-age=2592000";
    ~^/(assets/img|media)/  "public, max-age=86400";
}

server {
    # Только IPv4: в контейнере может не быть IPv6, и тогда nginx с [::]:80 не запустится
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;
    server_tokens off;
    # Редиректы относительные, чтобы не уводить на http:// и внутренний порт контейнера
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    add_header Cache-Control $site_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Сайт из одной страницы: несуществующие адреса ведут на главную
    error_page 404 = @home;
    location @home {
        return 302 /;
    }
}
